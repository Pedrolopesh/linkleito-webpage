# Build do site estático (Vue CLI 4). O Sass é compilado pelo pacote "sass" (JavaScript puro); o
# webpack 4 precisa do provedor legado do OpenSSL a partir do Node 17.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--openssl-legacy-provider"
